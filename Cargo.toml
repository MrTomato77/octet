[workspace]
members = ["crates/octet"]
resolver = "3"

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1

