[workspace]
members = ["crates/core", "crates/octet"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1

