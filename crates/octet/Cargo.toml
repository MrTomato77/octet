[package]
name = "octet"
version = "0.3.3"
edition = "2024"
rust-version = "1.98"
description = "Switch IPv4 and DNS settings on Windows in seconds."
license = "MIT"

[build-dependencies]
tauri-build = "2"
brotli = { version = "9", default-features = false, features = ["std"] }   # already in the build through Tauri; compresses the maker list

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-compact = { version = "2", default-features = false }
native-tls = "0.2"   # the speed test's TLS: the system's own (SChannel on Windows)
brotli = { version = "9", default-features = false, features = ["std"] }   # already in the exe through Tauri; unpacks the maker list

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Networking_NetworkListManager", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi", "Win32_System_Rpc"] }   # already in the build through Tauri; COM for the metered flag, WMI and Internet Sharing
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-system-configuration = "0.3"
objc2-core-wlan = "0.3"
objc2-core-location = "0.3"
