[package]
name = "octet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Switch IPv4 and DNS settings on Windows in seconds."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
ed25519-compact = { version = "2", default-features = false }
native-tls = "0.2"   # the speed test's TLS: the system's own (SChannel on Windows)

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Networking_NetworkListManager", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }   # already in the build through Tauri; COM for the metered flag
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-system-configuration = "0.3"
objc2-core-wlan = "0.3"
objc2-core-location = "0.3"
