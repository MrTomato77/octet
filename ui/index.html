<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octet layout demo</title>
<link rel="stylesheet" href="vendor/phosphor/style.css">
<script type="importmap">{ "imports": { "morphicons/region": "./vendor/morphicons/region.js" } }</script>
<style>
/* Layout spec. Every size in the window comes from these tokens. */
:root {
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px;
  --win-w: 680px; --win-h: 542px;
  --side-w: 216px;
  --label-w: 112px;          /* shared by adapter facts and the form */
  --col-gap: 16px;
  --field-w: 258px;          /* value column: octets 200 + "/ prefix" 58 */
  --octets-w: 200px;
  --row-h: 32px; --row-gap: 8px;
  --group-gap: 24px;         /* each side of a divider: 3x the row gap */
  --r-input: 4px; --r-item: 6px;
  --font: "Segoe UI Variable Text", "Segoe UI", "Noto Sans Thai", system-ui, sans-serif;
  /* Motion. Names follow Motion Reference; durations cut for a desktop tool
     (web references run 500-900ms, a utility should answer in 100-240ms). */
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);     /* easeOutCubic */
  --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1); /* easeOutBack, small overshoot */
  --t-press: 100ms; --t-fast: 140ms; --t-base: 180ms; --t-slow: 240ms;

  --bg: oklch(0.965 0.002 250); --surface: oklch(0.99 0.001 250); --side: oklch(0.94 0.004 250);
  --ink: oklch(0.24 0.01 250); --muted: oklch(0.47 0.012 250); --faint: oklch(0.62 0.01 250);
  --border: oklch(0.86 0.006 250); --border-strong: oklch(0.72 0.008 250);
  --hover: oklch(0.915 0.006 250); --select: oklch(0.895 0.008 250);
  --accent: oklch(0.5 0.15 255); --accent-ink: oklch(0.99 0 0); --accent-soft: oklch(0.93 0.035 255);
  --sel-fill: oklch(0.885 0.055 255); --sel-ink: oklch(0.27 0.06 255);
  --ok: oklch(0.6 0.13 150); --bad: oklch(0.55 0.18 25);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.215 0.006 250); --surface: oklch(0.245 0.006 250); --side: oklch(0.19 0.006 250);
    --ink: oklch(0.94 0.004 250); --muted: oklch(0.72 0.01 250); --faint: oklch(0.56 0.01 250);
    --border: oklch(0.35 0.008 250); --border-strong: oklch(0.48 0.01 250);
    --hover: oklch(0.27 0.008 250); --select: oklch(0.3 0.01 250);
    --accent: oklch(0.74 0.12 255); --accent-ink: oklch(0.17 0.02 255); --accent-soft: oklch(0.32 0.05 255);
    --sel-fill: oklch(0.38 0.075 255); --sel-ink: oklch(0.96 0.01 255);
    --ok: oklch(0.76 0.13 150); --bad: oklch(0.72 0.15 25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.215 0.006 250); --surface: oklch(0.245 0.006 250); --side: oklch(0.19 0.006 250);
  --ink: oklch(0.94 0.004 250); --muted: oklch(0.72 0.01 250); --faint: oklch(0.56 0.01 250);
  --border: oklch(0.35 0.008 250); --border-strong: oklch(0.48 0.01 250);
  --hover: oklch(0.27 0.008 250); --select: oklch(0.3 0.01 250);
  --accent: oklch(0.74 0.12 255); --accent-ink: oklch(0.17 0.02 255); --accent-soft: oklch(0.32 0.05 255);
    --sel-fill: oklch(0.38 0.075 255); --sel-ink: oklch(0.96 0.01 255);
  --ok: oklch(0.76 0.13 150); --bad: oklch(0.72 0.15 25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; gap: var(--s4);
  background: oklch(0.5 0.01 250 / 0.15); font: 14px/20px var(--font); color: var(--ink); padding: var(--s4); }
button, input, select { font: inherit; color: inherit; }
.note { font-size: 12px; color: var(--muted); max-width: var(--win-w); text-align: center; }

/* Window: fixed size, like the real app */
/* Collapsing the sidebar to a rail shrinks the window instead of leaving the
   fixed-width form floating in extra space (Tauri: appWindow.setSize). */
.window.rail { --side-w: 56px; --win-w: 520px; }
.window { width: var(--win-w); height: var(--win-h); display: grid; grid-template-rows: 32px 1fr;
  transition: width var(--t-slow) var(--ease-out);
  background: var(--bg); border-radius: 8px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--border-strong), 0 16px 48px oklch(0.2 0.02 250 / 0.25); }
.titlebar { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); font-size: 12px; color: var(--muted); background: var(--side); }
.titlebar i { font-size: 16px; color: var(--accent); }
.body { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 0; transition: grid-template-columns var(--t-slow) var(--ease-out); }

/* Sidebar */
.side { background: var(--side); border-right: 1px solid var(--border); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; overflow: hidden; }
.side-head { display: flex; align-items: center; gap: var(--s1); padding: var(--s3) var(--s2) var(--s2); }
.side-head h2 { flex: 1; margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }

/* Rail: icons only, status dot becomes a badge on the icon, names move to tooltips */
.rail .side-head { flex-direction: column; }
.rail .side-head h2, .rail .item .name { display: none; }
.rail .item { grid-template-columns: 20px; justify-content: center; padding: 0; }
.rail .side-foot .item { grid-template-columns: 20px; }
.rail .list .item .dot { position: absolute; left: 21px; top: 22px; width: 7px; height: 7px; box-shadow: 0 0 0 2px var(--side); }
.rail .list .item .dot.off { background: var(--side); box-shadow: inset 0 0 0 1.5px var(--faint), 0 0 0 2px var(--side); }
.rail .list .item[aria-current="true"] .dot { box-shadow: 0 0 0 2px var(--sel-fill); }
.rail .list .item[aria-current="true"] .dot.off { background: var(--sel-fill); box-shadow: inset 0 0 0 1.5px var(--sel-ink), 0 0 0 2px var(--sel-fill); }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: transparent;
  border-radius: var(--r-item); color: var(--muted); cursor: pointer; font-size: 18px; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:focus-visible, .item:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.list { list-style: none; margin: 0; padding: 0 var(--s2); display: grid; gap: 2px; align-content: start; overflow: auto; }
.item { position: relative; width: 100%; display: grid; grid-template-columns: 20px 1fr 8px; align-items: center; gap: var(--s3);
  height: 40px; padding: 0 var(--s3); border: 0; border-radius: var(--r-item); background: transparent; text-align: left; cursor: pointer; }
.item:hover { background: var(--hover); }
.list { position: relative; }
.list li { position: relative; z-index: 1; }
/* Selection: one accent block behind the rows that travels to the picked adapter.
   Motion: Motion Reference "tab indicator" (stretch toward the target, then settle on it). */
.indicator { position: absolute; z-index: 0; left: var(--s2); right: var(--s2); top: 0; height: 40px;
  border-radius: var(--r-item); background: var(--sel-fill); pointer-events: none; }
.item[aria-current="true"], .item[aria-current="true"]:hover { background: transparent; }
.item[aria-current="true"] i, .item[aria-current="true"] .name, .item.off[aria-current="true"] .name { color: var(--sel-ink); }
.item[aria-current="true"] .dot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--sel-ink); }
.item[aria-current="true"]:focus-visible { outline-color: var(--ink); }
.item i, .item .name { transition: color var(--t-fast) var(--ease-out); }
.item i { font-size: 18px; color: var(--muted); }
.item .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.item.off .name { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.side-foot { padding: var(--s2); border-top: 1px solid var(--border); }
.side-foot .item { grid-template-columns: 20px 1fr; }

/* Main pane */
.main { display: grid; grid-template-rows: 1fr auto; min-height: 0; background: var(--surface); }
.scroll { overflow: hidden; padding: var(--s4) var(--s6) var(--s4); }
/* Identity header: name + state on one line, hardware details as one meta line.
   Facts are not settings, so they no longer borrow the form's label column. */
.head { display: grid; grid-template-columns: minmax(0, max-content) auto 1fr auto; align-items: center; column-gap: var(--s3); }
.head h1 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.head h1 i { font-size: 20px; color: var(--muted); }
/* One hardware line: what the adapter is (left, truncates) and its address (right, never cut). */
.sub { grid-column: 1 / -1; margin: var(--s1) 0 0; display: flex; align-items: baseline; gap: var(--s6); font-size: 12px; line-height: 16px; color: var(--muted); }
.desc { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Lease source sits with the DHCP choice it belongs to */
.hint { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint:empty { display: none; }
.kv { display: inline-flex; gap: var(--s2); font-variant-numeric: tabular-nums; }
.kv .k { color: var(--muted); }
.kv[hidden] { display: none; }
.copy { border: 0; background: none; padding: 0; cursor: copy; border-radius: 2px; }
.copy:hover .v { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-strong); }
.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.state { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 var(--s2); border-radius: var(--r-input);
  background: var(--hover); font-size: 12px; line-height: 16px; white-space: nowrap; }
.state.off { color: var(--muted); }

/* One grid shape for facts and form rows, so all values share one left edge */
.grid { display: grid; grid-template-columns: var(--label-w) var(--field-w); column-gap: var(--col-gap); align-items: center; }
.break { border: 0; border-top: 1px solid var(--border); margin: var(--group-gap) 0; }
.form { row-gap: var(--row-gap); }
.form > label, .form > .lbl { color: var(--muted); }
.form > * { min-height: var(--row-h); display: flex; align-items: center; }
/* Mode toggle: two options, one thumb that slides left/right (Motion Reference "toggle morph") */
.ctl { gap: 0; }
/* Row action in the right column: same 40x32 box as the prefix and the DNS mark.
   Its job follows the mode, and the icon morphs when the job changes. */
.ext { position: relative; }
.slot-btn { width: 40px; height: var(--row-h); display: grid; place-items: center; padding: 0; border: 1px solid var(--border-strong);
  border-radius: var(--r-input); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 16px; }
.slot-btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.slot-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.slot-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.slot-btn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
.slot-btn { transition: background-color var(--t-fast) var(--ease-out), transform var(--t-press) var(--ease-out); }
.slot-btn:active:not(:disabled) { transform: scale(0.95); }
#presets { right: 0; top: 36px; min-width: 168px; }
#presets.up { top: auto; bottom: 36px; transform-origin: bottom right; }
#presets button { grid-template-columns: 20px 1fr; }
#presets .ips { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.plogo { width: 16px; height: 16px; background: var(--muted); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
#presets button:disabled { opacity: 0.45; cursor: not-allowed; }
/* Same width as the subnet octet box, so mode rows and address rows share one edge */
.seg { width: var(--octets-w); position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: var(--row-h);
  padding: 2px; border: 1px solid var(--border); border-radius: var(--r-item); background: var(--bg); }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: var(--r-input);
  background: var(--sel-fill); transition: transform 220ms var(--ease-back); }
.seg:has(input[value=manual]:checked) .thumb { transform: translateX(100%); }
.choice { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; padding: 0 var(--s4);
  color: var(--muted); cursor: pointer; white-space: nowrap; transition: color var(--t-fast) var(--ease-out); }
.choice:has(input:checked) { color: var(--sel-ink); font-weight: 600; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-input); }
.choice.disabled { color: var(--faint); cursor: not-allowed; }
.check { display: inline-flex; align-items: center; gap: var(--s2); font-size: 13px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

/* IPv4 input: four octets in fixed columns, identical in every row */
.ip { position: relative; display: flex; align-items: center; width: var(--field-w); height: var(--row-h);
  padding: 0 var(--s1); border: 1px solid var(--border-strong); border-radius: var(--r-input); background: var(--surface); }
.ip.short { width: var(--octets-w); }
.ip:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ip input { width: 40px; height: 100%; border: 0; background: transparent; text-align: center; outline: 0; padding: 0;
  font-variant-numeric: tabular-nums; }
.ip span.sep { width: 8px; text-align: center; color: var(--muted); }
.ip.ro { background: transparent; border-color: var(--border); }
.ip.ro input { color: var(--muted); }
.ip.invalid { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.diff { position: absolute; right: 10px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; transform: rotate(45deg);
  background: var(--accent); border-radius: 1px; display: none; }
.ip.changed .diff { display: block; }
/* Tail of the box: what kind of address this is (IP) or who runs it (DNS) */
.tag { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); height: 18px; padding: 0 5px; border-radius: var(--r-input);
  font-size: 11px; line-height: 18px; color: var(--muted); background: var(--hover); white-space: nowrap; pointer-events: auto; }
.tag:empty:not(.logo) { display: none; }
.tag.logo { width: 16px; height: 16px; padding: 0; background: currentColor;
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
.tag.public { color: var(--accent); }
/* The changed-mark takes the far right; the tag steps aside for it */
.ip.changed .tag { right: 27px; }
.tag { transition: right var(--t-fast) var(--ease-out); }
/* DNS: the resolver mark sits outside, in the column the subnet uses for "/ prefix".
   Every mark gets the same 28px tile so wide and narrow logos read the same size. */
.ext { flex: none; width: calc(var(--field-w) - var(--octets-w)); display: flex; justify-content: flex-end; }
/* Every right-column tile is 40x32, the size of the prefix box and the row buttons */
/* Every right-column tile is 40x32, the size of the prefix box and the row buttons */
.ext .tag { position: static; right: auto; transform: none; width: 40px; height: var(--row-h); line-height: var(--row-h); padding: 0;
  text-align: center; font-size: 10px; letter-spacing: -0.01em; overflow: hidden; }
.ext .tag.logo { position: relative; width: 40px; padding: 0; background: var(--hover); -webkit-mask: none; mask: none; }
.ext .tag.logo::after { content: ""; position: absolute; inset: 8px 12px; background: var(--muted);
  -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
/* Empty slot: dashed outline, faint "None" */
.ext .tag.empty { color: var(--faint); background: transparent; outline: 1px dashed var(--border); outline-offset: -1px; }
.tag.fresh { animation: rise var(--t-base) var(--ease-out); }
.subnet { display: flex; align-items: center; gap: 0; }
.slash { width: 18px; text-align: center; color: var(--muted); }
.prefix { width: 40px; height: var(--row-h); border: 1px solid var(--border-strong); border-radius: var(--r-input);
  background: var(--surface); text-align: center; outline: 0; font-variant-numeric: tabular-nums; }
.prefix:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.prefix:disabled { background: transparent; border-color: var(--border); color: var(--muted); }

/* Action bar */
.actions { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s6); border-top: 1px solid var(--border); background: var(--surface); }
.status { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.bad { color: var(--bad); }
.status.ok { color: var(--ok); }
.btn { height: 32px; padding: 0 var(--s4); border-radius: var(--r-item); border: 1px solid var(--border-strong); background: var(--surface);
  cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn i { font-size: 16px; }
/* Buttons wake up when there is something to apply, rewind when reverting */
.btn { transition: opacity 240ms var(--ease-out), background-color 240ms var(--ease-out), border-color 240ms var(--ease-out),
  color 240ms var(--ease-out), transform var(--t-press) var(--ease-out); }
.btn.rewind i { animation: rewind 420ms var(--ease-out); }
@keyframes rewind { from { transform: rotate(360deg); } }

/* Menus and dialog */
.menu { position: absolute; min-width: 220px; padding: var(--s1); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 8px 24px oklch(0.2 0.02 250 / 0.2); display: none; z-index: 10; }
.menu.open { display: grid; }
.menu button { display: grid; grid-template-columns: 20px 1fr; gap: var(--s2); align-items: center; height: 32px; padding: 0 var(--s2);
  border: 0; background: transparent; border-radius: var(--r-input); text-align: left; cursor: pointer; }
.menu button:hover { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: var(--s1) 0; }
.menu i { font-size: 16px; color: var(--muted); }
.head-wrap { position: relative; z-index: 2; }
dialog { width: 400px; max-width: calc(var(--win-w) - 2 * var(--s6)); position: fixed; margin: 0; padding: 0;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: oklch(0.2 0.02 250 / 0.35); }
.dlg-body { padding: var(--s6); display: grid; gap: var(--s4); }
.dlg-body h3 { margin: 0; font-size: 16px; font-weight: 600; }
.set { display: grid; grid-template-columns: 96px 1fr; column-gap: var(--col-gap); row-gap: var(--s2); align-items: start; }
.set .lbl { color: var(--muted); min-height: 32px; display: flex; align-items: center; }
.set > .check, .set .stack > * { min-height: 32px; }
.set select { height: 32px; border: 1px solid var(--border-strong); border-radius: var(--r-input); background: var(--surface); padding: 0 var(--s2); }
.set .stack { display: grid; gap: 0; }
.dlg-foot { display: flex; justify-content: space-between; gap: var(--s2); padding: var(--s3) var(--s6); border-top: 1px solid var(--border); }
.link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }

/* ---------- Motion ---------- */
.mi { width: 16px; height: 16px; display: block; }
.icon-btn .mi { width: 18px; height: 18px; }
.spin .mi { animation: spin 800ms linear infinite; }
/* Broom: held at the top of the handle, the bristles flick left twice (fast stroke, slow return),
   and a puff of dust leaves the bristles on each stroke. */
.slot-btn { position: relative; }
.sweep .mi { transform-origin: 85% 15%; animation: sweep 800ms var(--ease-out); }
@keyframes sweep {
  0% { transform: rotate(0); }
  18% { transform: rotate(16deg); animation-timing-function: ease-in-out; }
  45% { transform: rotate(-6deg); animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0); }
  63% { transform: rotate(16deg); animation-timing-function: ease-in-out; }
  100% { transform: rotate(0); } }
.sweep::before, .sweep::after { content: ""; position: absolute; left: 11px; top: 21px; width: 2px; height: 2px; border-radius: 50%;
  background: currentColor; box-shadow: -3px 2px 0 0 currentColor, -1px -2px 0 -0.5px currentColor; opacity: 0; pointer-events: none;
  animation: dust 420ms var(--ease-out) 60ms; }
.sweep::after { top: 19px; animation-delay: 420ms; }
@keyframes dust { 0% { opacity: 0; transform: none; } 20% { opacity: 0.8; } 100% { opacity: 0; transform: translate(-7px, -2px) scale(0.6); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* Press feedback */
.icon-btn, .item { transition: background-color var(--t-fast) var(--ease-out), transform var(--t-press) var(--ease-out); }
.btn:active:not(:disabled), .icon-btn:active { transform: scale(0.97); }
.item:active { transform: scale(0.99); }

/* Fade + slide: adapter content when switching adapters */
.swap > * { animation: rise var(--t-base) var(--ease-out) backwards; }
.swap > :nth-child(n+3) { animation-delay: 30ms; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }

/* Fields: state changes ease instead of jumping */

.ip input.roll { animation: roll 280ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 45ms); }

@keyframes pop { from { transform: rotate(45deg) scale(0); } }
/* Nudge: a field that turns invalid */
.ip.invalid { animation: nudge 280ms var(--ease-out); }
@keyframes nudge { 25% { transform: translateX(-3px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-1px); } }

/* Menu and dialog open */
.menu { transform-origin: top right; }
.menu.open { animation: menu-in var(--t-fast) var(--ease-out); }
@keyframes menu-in { from { opacity: 0; transform: scale(0.97) translateY(-4px); } }

  [["9.9.9.9", "149.112.112.112"], "Quad9", "quad9"],
  [["94.140.14.14", "94.140.15.15"], "AdGuard DNS", "adguard"],

function resolver(v) {
  if (!validIp(v)) return null;

      .then(reload).then(() => { renderList(); renderAdapterFacts(); }, e => say(String(e), "bad"));
    return;
  }
  if (act === "ncpa" && tauri) { invoke("open_ncpa").catch(e => say(String(e), "bad")); return; }
  if (["release", "renew", "cycle"].includes(act) && a.cfg.ipAuto) { leaseAction(act); return; }
  say({ release: "Not a DHCP adapter", renew: "Not a DHCP adapter", cycle: "Not a DHCP adapter", ncpa: "Opens ncpa.cpl (demo)" }[act]);
};

// ---------- DHCP lease (demo: a random address from the same scope) ----------
function leaseAction(act) {
  const a = adapters[sel];
  if (tauri) {
    say(act === "release" ? "Releasing…" : "Renewing lease…");
    const go = act === "cycle" ? change({ op: "release", name: a.name }).then(() => change({ op: "renew", name: a.name }))
      : change({ op: act, name: a.name });
    return go.then(reload).then(() => {
      const c = adapters[sel].cfg;
      if (draft.ipAuto) for (const k of ["address", "subnet", "gateway"]) draft[k] = c[k];
      if (draft.dnsAuto) for (const k of ["dns1", "dns2"]) draft[k] = c[k];
      renderAdapterFacts(); renderForm(true);
      say(act === "release" ? "Lease released" : "Lease renewed" + (adapters[sel].dhcpServer ? " from " + adapters[sel].dhcpServer : ""), "ok");
    }, e => say(String(e), "bad"));
  }
  const fresh = () => { const o = 100 + Math.floor(Math.random() * 150); return { address: `10.0.1.${o}`, subnet: "255.255.254.0", gateway: "10.0.0.1", dns1: "8.8.8.8", dns2: "8.8.4.4" }; };
  const none = { address: "", subnet: "", gateway: "", dns1: "", dns2: "" };
  const put = (v, msg) => {
    Object.assign(a.cfg, v);
    // While a group is automatic the draft mirrors Windows, so Manual later starts from the new lease.
    if (draft.ipAuto) for (const k of ["address", "subnet", "gateway"]) draft[k] = v[k];
    if (draft.dnsAuto) for (const k of ["dns1", "dns2"]) draft[k] = v[k];
    a.dhcpServer = v.address ? "10.0.0.1" : ""; renderAdapterFacts(); renderForm(true); say(msg); };
  if (act === "release") put(none, "Lease released");
  else if (act === "renew") put(fresh(), "Lease renewed from 10.0.0.1");
  else { put(none, "Releasing…"); setTimeout(() => put(fresh(), "Lease renewed from 10.0.0.1"), 700); }
}

// ---------- row buttons ----------
const presets = [
  { name: "Google", logo: "google", ips: ["8.8.8.8", "8.8.4.4"] },
  { name: "Cloudflare", logo: "cloudflare", ips: ["1.1.1.1", "1.0.0.1"] },
  { name: "Quad9", logo: "quad9", ips: ["9.9.9.9", "149.112.112.112"] },
  { name: "AdGuard", logo: "adguard", ips: ["94.140.14.14", "94.140.15.15"] },
];
function slotIcon(id, name) {
  if (window.morph?.[id]) return window.morph[id](name);
  const i = $(id).querySelector("i.ph"); if (i) i.className = "ph ph-" + name;
}
function renderSlots() {
  const a = adapters[sel], cur = a.cfg, ip = $("ip-act"), dns = $("dns-act");
  if (draft.ipAuto) {
    ip.dataset.act = "renew"; slotIcon("ip-act", "arrows-clockwise");
    ip.disabled = !cur.ipAuto;
    ip.title = cur.ipAuto ? `Renew lease${a.dhcpServer ? " from " + a.dhcpServer : ""}` : "Apply DHCP first, then renew";
  } else {
    ip.dataset.act = "pull"; slotIcon("ip-act", "tray-arrow-down");
    ip.disabled = !cur.address;
    ip.title = "Fill with the values Windows has now";
  }
  ip.setAttribute("aria-label", ip.title);
  if (draft.dnsAuto) { dns.dataset.act = "flush"; slotIcon("dns-act", "broom"); dns.title = "Flush DNS cache"; }
  else { dns.dataset.act = "presets"; slotIcon("dns-act", "list-bullets"); dns.title = "Choose a DNS provider"; }
  dns.setAttribute("aria-label", dns.title);
  setPresets(false);
}
function busy(btn, ms, done, motion = "spin") { btn.classList.add(motion); btn.disabled = true; setTimeout(() => { btn.classList.remove(motion); btn.disabled = false; done(); }, ms); }
$("ip-act").onclick = () => {
  const btn = $("ip-act"), cur = adapters[sel].cfg;
  if (btn.dataset.act === "renew") { say("Renewing lease…"); busy(btn, 600, () => { leaseAction("renew"); renderSlots(); }); return; }
  for (const k of ["address", "subnet", "gateway"]) { draft[k] = cur[k]; fields[k].set(cur[k], true, true); }
  sync(); say("Filled with current values");
};
function setPresets(open) {
  const menu = $("presets");
  menu.classList.toggle("open", open);
  menu.classList.remove("up");
  $("dns-act").setAttribute("aria-expanded", open);
  if (!open) return;
  const gw = draft.gateway || adapters[sel].cfg.gateway;
  menu.innerHTML = "";
  for (const p of [...presets, { name: "Router", icon: "ph-house", ips: [gw, ""], off: !validIp(gw || "") }]) {
    const b = document.createElement("button");
    b.setAttribute("role", "menuitem"); b.disabled = !!p.off;
    b.innerHTML = p.logo ? `<span class="plogo" style="--logo:url(vendor/logos/${p.logo}.svg)"></span>` : `<i class="ph ${p.icon}"></i>`;
    b.insertAdjacentHTML("beforeend", `<span></span>`);
    b.children[1].textContent = p.name;
    b.title = p.off ? "No gateway" : p.ips.filter(Boolean).join(", ");
    b.onclick = e => {
      e.stopPropagation();
      [draft.dns1, draft.dns2] = p.ips;
      fields.dns1.set(draft.dns1, true, true); fields.dns2.set(draft.dns2, true, true);
      setPresets(false); sync(); say(`DNS set to ${p.name}`);
    };
    menu.append(b);
  }
  const limit = document.querySelector(".actions").getBoundingClientRect().top;
  if (menu.getBoundingClientRect().bottom > limit - 4) menu.classList.add("up");
}
$("dns-act").onclick = e => {
  e.stopPropagation();
  const btn = $("dns-act");
  if (btn.dataset.act === "flush") {
    say("Flushing DNS cache…");
    const work = tauri ? invoke("flush_dns").then(() => null, e => String(e)) : Promise.resolve(null);
    busy(btn, 800, () => work.then(err => err ? say(err, "bad") : say("DNS cache flushed", "ok")), "sweep");
    return;
  }
  setPresets(!$("presets").classList.contains("open"));
};
document.addEventListener("click", () => setPresets(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") setPresets(false); });

// ---------- whole-config copy and paste ----------
// "192.168.1.50/24 gw 192.168.1.1 dns 1.1.1.1, 8.8.8.8" in, the same format out.
function parseConfig(text) {
  const ip = "(\\d{1,3}(?:\\.\\d{1,3}){3})";
  const m = text.match(new RegExp(`^\\s*${ip}\\s*(?:/(\\d{1,2})|\\s+(?:mask\\s+)?${ip})`, "i"));
  if (!m) return null;
  const mask = m[2] !== undefined ? masks[+m[2]] : m[3];
  if (!mask || !validIp(m[1])) return null;
  const gw = text.match(new RegExp(`(?:gw|gateway)\\s*:?\\s*${ip}`, "i"));
  const dns = text.match(new RegExp(`dns\\s*:?\\s*${ip}(?:\\s*[,\\s]\\s*${ip})?`, "i"));
  return { address: m[1], subnet: mask, gateway: gw ? gw[1] : "", dns1: dns ? dns[1] : "", dns2: dns && dns[2] ? dns[2] : "" };
}
function pasteConfig(text) {
  const c = parseConfig(text);
  if (!c) return false;
  draft.ipAuto = false; Object.assign(draft, { address: c.address, subnet: c.subnet, gateway: c.gateway });
  if (c.dns1) { draft.dnsAuto = false; draft.dns1 = c.dns1; draft.dns2 = c.dns2; } else draft.dnsAuto = false;
  renderForm();
  for (const k of ["address", "subnet", "gateway", "dns1", "dns2"]) fields[k].set(draft[k], true, true);
  sync(); say("Pasted a full configuration");
  return true;
}
function configText() {
  const v = k => fields[k].inputs.map(shownOf).join(".");
  const p = prefixOf(v("subnet")), d = [v("dns1"), v("dns2")].filter(validIp);
  return `${v("address")}/${p >= 0 ? p : v("subnet")}` + (validIp(v("gateway")) ? ` gw ${v("gateway")}` : "") + (d.length ? ` dns ${d.join(", ")}` : "");
}
document.addEventListener("copy", e => {
  if (document.activeElement?.matches("input") && getSelection().toString()) return;
  if (document.activeElement?.matches("input:not([type=checkbox]):not([type=radio])")) return;
  e.preventDefault(); e.clipboardData.setData("text/plain", configText()); say("Configuration copied", "ok", "check");
});
document.addEventListener("paste", e => {
  if (document.activeElement?.matches(".ip input, .prefix")) return;   // the field handles it
  if (pasteConfig(e.clipboardData.getData("text"))) e.preventDefault();
});

function renderHidden() {
  const box = $("s-hidden"); box.innerHTML = "";
  if (!hidden.size) { box.innerHTML = `<span class="check">${t("noneHidden")}</span>`; return; }
  adapters.filter(a => hidden.has(a.id)).forEach(a => {
    const l = document.createElement("label"); l.className = "check";
    l.innerHTML = `<input type="checkbox" checked><span></span>`; l.querySelector("span").textContent = a.name;
    l.querySelector("input").onchange = () => { hidden.delete(a.id); renderList(); renderHidden(); };
    box.append(l);
  });
}
// A modal centres on the viewport; in Tauri that is the window. The demo page is
// larger, so centre it on the window explicitly.
$("open-settings").onclick = () => {
  renderHidden();
  const dlg = $("settings"); dlg.showModal();
  const w = document.querySelector(".window").getBoundingClientRect(), d = dlg.getBoundingClientRect();
  dlg.style.left = `${w.left + (w.width - d.width) / 2}px`;
  dlg.style.top = `${w.top + (w.height - d.height) / 2}px`;
};
$("s-theme").onchange = e => {
  const v = e.target.value;
  const go = () => { if (v === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = v; };
  document.startViewTransition && !calm.matches ? document.startViewTransition(go) : go();
};
$("s-lang").onchange = e => { lang = e.target.value; document.documentElement.lang = lang; translate(); renderList(); renderAdapter(); renderHidden(); };
function translate() { document.querySelectorAll("[data-t]").forEach(el => { const v = T[lang][el.dataset.t]; if (typeof v === "string") el.textContent = v; }); }
// Sidebar collapse, remembered per machine (storage may be unavailable; the default is expanded)
function setRail(on, instant) {
  const win = document.querySelector(".window");
  if (instant) win.style.transition = "none";
  win.classList.toggle("rail", on);
  $("collapse").setAttribute("aria-expanded", !on);
  $("collapse").title = on ? "Expand sidebar (Ctrl+B)" : "Collapse sidebar (Ctrl+B)";
  $("collapse").setAttribute("aria-label", on ? "Expand sidebar" : "Collapse sidebar");
  try { localStorage.setItem("octet-rail", on ? "1" : "0"); } catch {}
  tauri?.window.getCurrentWindow().setSize(new tauri.dpi.LogicalSize(on ? 520 : 680, 510));
  requestAnimationFrame(() => { placeIndicator(); if (instant) win.style.transition = ""; });
}
$("collapse").onclick = () => setRail(!document.querySelector(".window").classList.contains("rail"));
document.querySelector(".body").addEventListener("transitionend", placeIndicator);
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "b" && e.ctrlKey) { e.preventDefault(); $("collapse").click(); }
  if (e.key === "F5") { e.preventDefault(); $("refresh").click(); }
  if (e.key === "Enter" && e.ctrlKey && !$("apply").disabled) $("apply").click();
});

// Tooltips replace native titles (5). In the rail they fly out beside the icon (14).
const tip = document.createElement("div");
tip.className = "tip"; tip.setAttribute("role", "tooltip"); document.body.append(tip);
let tipEl = null, tipTimer = 0;
function hideTip() { clearTimeout(tipTimer); tipEl = null; tip.classList.remove("show"); }
document.addEventListener("pointerover", e => {
  const el = e.target.closest("[title], [data-tip]");
  if (el === tipEl) return;
  hideTip();
  if (!el) return;
  if (el.hasAttribute("title")) { el.dataset.tip = el.title; el.removeAttribute("title"); }
  if (!el.dataset.tip) return;
  tipEl = el;
  const side = !!el.closest(".rail .side");
  tipTimer = setTimeout(() => {
    tip.textContent = el.dataset.tip;
    tip.className = "tip" + (side ? " side" : "");
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x, y;
    if (side) { x = r.right + 8; y = r.top + (r.height - h) / 2; }
    else {
      x = Math.min(Math.max(4, r.left + (r.width - w) / 2), innerWidth - w - 4);
      y = r.bottom + 6 + h > innerHeight - 4 ? r.top - h - 6 : r.bottom + 6;
    }
    tip.style.left = x + "px"; tip.style.top = y + "px";
    void tip.offsetWidth; tip.classList.add("show");
  }, side ? 120 : 450);
});
document.addEventListener("pointerdown", hideTip);
document.addEventListener("keydown", hideTip);

// App open (13): skeleton first, then the real values count in.
renderAdapterFacts();
draft = structuredClone(adapters[sel].cfg);
for (let k = adapters.filter(a => !hidden.has(a.id)).length; k > 0; k--) { const li = document.createElement("li"); li.className = "skel"; $("list").append(li); }
document.querySelector(".scroll").classList.add("loading");
(tauri ? reload().catch(e => e) : new Promise(res => setTimeout(res, calm.matches ? 0 : 600))).then(err => {
  document.querySelector(".scroll").classList.remove("loading");
  renderList(true); renderAdapter(true);
  if (err) say("Could not read adapters, showing sample data: " + err, "bad");
});
let railPref = null;
try { railPref = localStorage.getItem("octet-rail"); } catch {}
setRail(railPref !== "0", true);
</script>
<script type="module">
// morphicons (MIT) morphs Phosphor's own SVGs, so the icon family stays one.
import { createMorph, preloadRegion } from "./vendor/morphicons/dom.js";
import { svgToIcon } from "./vendor/morphicons/adapters.js";
import svgs from "./vendor/icons.js";
const NS = "http://www.w3.org/2000/svg";
const names = ["shield-check", "circle-notch", "check", "arrow-clockwise", "dots-three", "x", "arrows-clockwise", "tray-arrow-down", "broom", "list-bullets"];
const icons = Object.fromEntries(await Promise.all(names.map(async n =>
  [n, svgToIcon(svgs[n])])));
await preloadRegion();
function morphable(id, start) {
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true"); svg.classList.add("mi");
  const path = document.createElementNS(NS, "path"); path.setAttribute("fill", "currentColor");
  svg.append(path);
  document.getElementById(id).querySelector("i.ph").replaceWith(svg);
  const m = createMorph(path, icons[start], { reducedMotion: "user" });
  return name => m.morphTo(icons[name], "snappy");
}
const startOf = id => document.getElementById(id).querySelector("i.ph").className.replace("ph ph-", "");
window.morph = { apply: morphable("apply", "shield-check"), refresh: morphable("refresh", "arrow-clockwise"), more: morphable("more", "dots-three"),
  "ip-act": morphable("ip-act", startOf("ip-act")), "dns-act": morphable("dns-act", startOf("dns-act")) };
</script>
